<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DISCRAFT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }



    
    body{
      background:#050505;
      color:white;
      overflow-x:hidden;
    }

    /* =========================
       BACKGROUND EFFECTS
    ========================== */

    .bg-grid{
      position:fixed;
      width:100%;
      height:100%;
      background:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

      background-size:40px 40px;
      z-index:-3;
    }

    .blur{
      position:fixed;
      width:500px;
      height:500px;
      border-radius:50%;
      filter:blur(180px);
      z-index:-2;
      opacity:0.18;
    }

    .blur1{
      background:#00bfff;
      top:-100px;
      left:-100px;
    }

    .blur2{
      background:#8a2be2;
      bottom:-150px;
      right:-100px;
    }

    /* =========================
       NAVBAR
    ========================== */

    nav{
      width:100%;
      padding:22px 8%;
      position:fixed;
      top:0;
      left:0;

      display:flex;
      justify-content:space-between;
      align-items:center;

      backdrop-filter:blur(14px);
      background:rgba(0,0,0,0.25);

      border-bottom:1px solid rgba(255,255,255,0.05);

      z-index:1000;
    }

    .logo{
      font-size:1.6rem;
      font-weight:700;
      letter-spacing:3px;
    }

    .logo span{
      color:#00bfff;
    }

    nav ul{
      display:flex;
      list-style:none;
      gap:35px;
    }

    nav ul li a{
      text-decoration:none;
      color:#d9d9d9;
      font-size:0.95rem;
      transition:0.3s;
      position:relative;
    }

    nav ul li a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-6px;
      width:0%;
      height:2px;
      background:#00bfff;
      transition:0.3s;
    }

    nav ul li a:hover{
      color:white;
    }

    nav ul li a:hover::after{
      width:100%;
    }

    /* =========================
       HERO SECTION
    ========================== */

    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:120px 8% 80px;
      position:relative;
    }

    .hero-container{
      display:grid;
      grid-template-columns:1fr 1fr;
      align-items:center;
      gap:60px;
      width:100%;
      max-width:1400px;
    }

    .hero-left{
      animation:fadeUp 1s ease;
    }

    .mini-tag{
      display:inline-block;
      padding:10px 18px;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:999px;
      color:#00bfff;
      font-size:0.9rem;
      margin-bottom:25px;
      background:rgba(255,255,255,0.03);
    }

    .hero-left h1{
      font-size:5rem;
      line-height:1.05;
      margin-bottom:25px;
      font-weight:800;
    }

    .hero-left h1 span{
      background:linear-gradient(to right,#00bfff,#8a2be2);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero-left p{
      color:#bfbfbf;
      font-size:1.1rem;
      line-height:1.9;
      max-width:650px;
      margin-bottom:40px;
    }

    .hero-buttons{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }

    .btn{
      padding:16px 32px;
      border-radius:999px;
      text-decoration:none;
      transition:0.35s;
      font-weight:600;
      font-size:0.95rem;
    }

    .primary{
      background:linear-gradient(to right,#00bfff,#8a2be2);
      color:white;
      box-shadow:0 10px 40px rgba(0,191,255,0.25);
    }

    .primary:hover{
      transform:translateY(-4px) scale(1.02);
    }

    .secondary{
      border:1px solid rgba(255,255,255,0.12);
      color:white;
      background:rgba(255,255,255,0.03);
    }

    .secondary:hover{
      background:rgba(255,255,255,0.08);
      transform:translateY(-4px);
    }

    /* =========================
       RIGHT SIDE CARD
    ========================== */

    .hero-right{
      display:flex;
      justify-content:center;
      align-items:center;
      animation:float 5s ease-in-out infinite;
    }

    .glass-card{
      width:100%;
      max-width:480px;
      padding:35px;

      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);

      backdrop-filter:blur(20px);

      border-radius:30px;

      box-shadow:
      0 10px 40px rgba(0,0,0,0.4),
      inset 0 0 20px rgba(255,255,255,0.03);
    }

    .card-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .circle-group{
      display:flex;
      gap:10px;
    }

    .circle{
      width:14px;
      height:14px;
      border-radius:50%;
    }

    .red{background:#ff5f57;}
    .yellow{background:#ffbd2e;}
    .green{background:#28c840;}

    .status{
      color:#00ff9d;
      font-size:0.9rem;
    }

    .code-box{
      background:#0b0b0b;
      padding:22px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.05);
      overflow:hidden;
    }

    .code-line{
      margin:14px 0;
      color:#d0d0d0;
      font-family:monospace;
      font-size:0.95rem;
    }

    .highlight{
      color:#00bfff;
    }

    .purple{
      color:#c084fc;
    }

    .greenText{
      color:#00ff9d;
    }

    /* =========================
       STATS
    ========================== */

    .stats{
      display:flex;
      gap:30px;
      margin-top:40px;
      flex-wrap:wrap;
    }

    .stat-box{
      padding:18px 22px;
      border-radius:20px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.05);
      min-width:140px;
    }

    .stat-box h2{
      font-size:2rem;
      margin-bottom:8px;
      color:#00bfff;
    }

    .stat-box p{
      color:#bfbfbf;
      font-size:0.9rem;
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(50px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes float{
      0%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-18px);
      }
      100%{
        transform:translateY(0px);
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media(max-width:1000px){

      .hero-container{
        grid-template-columns:1fr;
      }

      .hero-left{
        text-align:center;
      }

      .hero-left p{
        margin:auto auto 40px;
      }

      .hero-buttons{
        justify-content:center;
      }

      .stats{
        justify-content:center;
      }

      .hero-left h1{
        font-size:3.8rem;
      }
    }

    @media(max-width:700px){

      nav ul{
        display:none;
      }

      .hero-left h1{
        font-size:2.8rem;
      }

      .glass-card{
        padding:25px;
      }
    }

  </style>
</head>
